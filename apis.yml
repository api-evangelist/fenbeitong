name: Fenbeitong
description: >-
  Fenbeitong (分贝通) is a Beijing-based enterprise expenditure and spend
  management platform that unifies corporate travel (flights, rail, hotel,
  ride-hailing), dining, takeout, procurement, budgeting, reimbursement and
  payment into a single SaaS-plus-payment system for over 4,000 companies. Its
  Open Platform (开放平台) exposes a token- and signature-authenticated REST API
  that lets partnered enterprises integrate organization structure, orders,
  approvals, budgets and billing, and receive real-time order events via
  webhooks. Founded in 2016 and backed by Ribbit Capital and DST Global, the
  company operates production and sandbox API environments.
