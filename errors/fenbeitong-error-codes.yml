type: ErrorCatalog
format: envelope-code
envelope:
  shape: '{ request_id, code, msg, data }'
  success_code: 0
  code_field: code
  message_field: msg
  correlation_field: request_id
  notes: >-
    API-level outcome is signalled by the integer `code` in the response
    envelope (0 = success, non-zero = failure) with a human-readable `msg`.
    Fenbeitong does not use RFC 9457 application/problem+json; errors ride the
    JSON envelope. Beyond the envelope, each product surfaces its own
    order-lifecycle status-code registry (状态码) — captured below.
status_code_registry:
  description: >-
    Per-product status/state code tables published under section 4 (状态码).
    These are order-lifecycle and business states, not HTTP errors.
  domains:
  - domain: flights (机票)
    tables:
    - 机票订单状态码表 (flight order status)
    - 机票状态码表 (flight status)
    url: http://docs.open.fenbeitong.com/open-api/4zhuang-tai-ma/41-ji-piao-zhuang-tai-ma.html
  - domain: car (用车)
    url: http://docs.open.fenbeitong.com/open-api/4zhuang-tai-ma/42-yong-che-zhuang-tai-ma.html
  - domain: train (火车)
